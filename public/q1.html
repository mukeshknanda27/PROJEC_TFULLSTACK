<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="s1.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">BRAVINO</div>

        <div class="nav-links">
            <span>Dashboard</span>
            <span>Courses</span>
            <span>Profile</span>
        </div>
    </div>
    <div class="container">
        <div class="profile-card">
            <div>
                <div class="name">Mukesh Kumar Nanda</div>
                <div class="role">Java Developer</div>
                <div class="batch">Batch : JAVA</div>
            </div>
            <span class="status">ACTIVE</span>
        </div>
        <div class="section-title">Learning Statistics</div>

        <div class="stats-container">

            <div class="stats-card">
                <div class="number">12</div>
                <div class="description">Total Courses</div>
            </div>

            <div class="stats-card">
                <div class="number">8</div>
                <div class="description">Completed</div>
            </div>

            <div class="stats-card">
                <div class="number">4</div>
                <div class="description">Pending</div>
            </div>

        </div>

        
        <div class="skills-card">
            <div class="section-title">Technical Skills</div>

            <div class="skills-list">
                <span>Java</span>
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>SQL</span>
            </div>
        </div>

        
        <div class="notification">
            New Java Advanced Module is available. Keep learning!
        </div>
        <div class="footer">
            KEEP LEARNING • KEEP GROWING
        </div>

    </div>

    
</body>
</html>
